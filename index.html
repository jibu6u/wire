<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Seeded Solid Cubes Illusion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin:0; overflow:hidden; background:#000; font-family:sans-serif; }
    #ui {
      position:fixed; top:12px; left:12px; z-index:10;
      background:rgba(20,20,20,0.85); padding:12px; border-radius:12px;
      color:#fff; font-size:14px; width:340px;
    }
    .row { display:flex; align-items:center; margin:6px 0; gap:8px; }
    label { flex:1; }
    input[type=range] { flex:2; }
    button { padding:6px 10px; border:none; border-radius:8px; cursor:pointer; }
    button.ghost { background:#444; color:#ccc; }
    button.active { background:#2a9d8f; color:#fff; }
  </style>
</head>
<body>
  <div id="ui">
    <h3>Seeded Solid Cubes</h3>
    <div class="row">
      <button id="illusionBtn" class="ghost">착시 모드: OFF</button>
    </div>
    <div class="row">
      <label>위상 차이 (rad)</label>
      <input id="phaseDiff" type="range" min="0" max="3.14" step="0.1" value="0.5">
    </div>
    <div class="row">
      <label>좌안 흔들림 강도</label>
      <input id="ampLeft" type="range" min="0" max="0.5" step="0.01" value="0.2">
    </div>
    <div class="row">
      <label>우안 흔들림 강도</label>
      <input id="ampRight" type="range" min="0" max="0.5" step="0.01" value="0.2">
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
    import { VRButton } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/VRButton.js';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.set(0,1.6,3);

    const renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);
    document.body.appendChild(VRButton.createButton(renderer));

    const light = new THREE.HemisphereLight(0xffffff, 0x222233, 1);
    scene.add(light);

    const group = new THREE.Group();
    scene.add(group);

    // ===== 색상 팔레트 (3가지 색) =====
    const palette = [
      new THREE.Color(0xff4444), // 빨강
      new THREE.Color(0x44ff44), // 초록
      new THREE.Color(0x4444ff)  // 파랑
    ];

    const geo = new THREE.BoxGeometry(0.4,0.4,0.4);
    const COUNT = 15;
    for (let i=0;i<COUNT;i++){
      // 3색을 랜덤 선택해서 마주보는 면 동일하게
      const materials = [];
      const chosen = palette[Math.floor(Math.random()*3)];
      const chosen2 = palette[Math.floor(Math.random()*3)];
      const chosen3 = palette[Math.floor(Math.random()*3)];
      materials.push(new THREE.MeshStandardMaterial({color:chosen}));
      materials.push(new THREE.MeshStandardMaterial({color:chosen}));
      materials.push(new THREE.MeshStandardMaterial({color:chosen2}));
      materials.push(new THREE.MeshStandardMaterial({color:chosen2}));
      materials.push(new THREE.MeshStandardMaterial({color:chosen3}));
      materials.push(new THREE.MeshStandardMaterial({color:chosen3}));
      const cube = new THREE.Mesh(geo, materials);
      resetCube(cube,true);
      group.add(cube);
    }

    function resetCube(cube, randomZ=false){
      cube.position.set((Math.random()-0.5)*6.0, (Math.random()-0.5)*2.0+1.3, randomZ? (Math.random()*-8-2) : -8);
      cube.userData.speed = 0.015 + Math.random()*0.02;
      cube.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
    }

    // ===== UI =====
    const illusionBtn = document.getElementById("illusionBtn");
    const phaseDiffEl = document.getElementById("phaseDiff");
    const ampLeftEl = document.getElementById("ampLeft");
    const ampRightEl = document.getElementById("ampRight");

    let illusionMode = false;
    illusionBtn.onclick = () => {
      illusionMode = !illusionMode;
      illusionBtn.textContent = "착시 모드: " + (illusionMode ? "ON" : "OFF");
      illusionBtn.className = illusionMode ? "active" : "ghost";
    };

    // ===== 렌더링 루프 =====
    group.traverse(obj=>{
      if(!obj.isMesh) return;
      obj.onBeforeRender = (renderer, scn, cam, geo, mat)=>{
        const xrCam = renderer.xr.getCamera();
        if(xrCam && xrCam.isArrayCamera && xrCam.cameras.length>=2){
          const isLeftEye = (cam === xrCam.cameras[0]);
          const now = performance.now()/1000;

          if(illusionMode){
            const φ = parseFloat(phaseDiffEl.value);
            const ampL = parseFloat(ampLeftEl.value);
            const ampR = parseFloat(ampRightEl.value);
            if(isLeftEye){
              obj.position.x += Math.sin(2*Math.PI*1.5*now) * ampL;
              obj.position.y += Math.cos(2*Math.PI*1.5*now) * ampL;
            } else {
              obj.position.x += Math.sin(2*Math.PI*1.5*now + φ) * ampR;
              obj.position.y += Math.cos(2*Math.PI*1.5*now + φ) * ampR;
            }
          }
        }
      };
    });

    renderer.setAnimationLoop(()=>{
      group.children.forEach(c=>{
        c.rotation.x += 0.01;
        c.rotation.y += 0.012;
        c.position.z += c.userData.speed;
        if(c.position.z>1) resetCube(c);
      });
      renderer.render(scene,camera);
    });

    window.addEventListener('resize',()=>{
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth,window.innerHeight);
    });
  </script>
</body>
</html>
