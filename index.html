<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seeded Wire Cubes (7-Point Seed → Random Palette) + WebXR</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    #hud{position:fixed;left:16px;top:16px;z-index:10;background:rgba(0,0,0,.8);color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:12px;backdrop-filter:blur(8px);min-width:280px}
    #hud h3{margin:0 0 8px;color:#8be9a3;font-size:15px}
    .row{display:flex;align-items:center;gap:8px;margin:6px 0}
    label{font-size:12px;white-space:nowrap}
    input[type=range]{width:150px}
    .pill{display:inline-block;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.08);font-size:12px}
    button{appearance:none;border:0;border-radius:10px;padding:8px 12px;margin-right:6px;color:#fff;background:linear-gradient(45deg,#45d08f,#2a9d8f);cursor:pointer}
    button.ghost{background:rgba(255,255,255,.08)}
    #dbg{position:fixed;left:16px;top:120px;color:#b3e5c1;z-index:9;font:12px/1.5 monospace;background:rgba(0,0,0,.45);padding:8px 10px;border-radius:8px;min-width:280px;white-space:pre}
    #seedCanvas{position:fixed;inset:0;display:block;z-index:1;pointer-events:auto;touch-action:none;cursor:crosshair}
    #three{position:fixed;inset:0;z-index:0}
    #help{position:fixed;right:16px;bottom:16px;color:#9aa4ad;background:rgba(0,0,0,.45);padding:8px 10px;border-radius:8px;font-size:12px}
  </style>
</head>
<body>
  <div id="hud">
    <h3>Seeded Wire Cubes</h3>
    <div class="row">시드: <span id="seedVal" class="pill">없음</span></div>
    <div class="row">점: <span id="ptCount" class="pill">0/7</span> · 팔레트: <span id="palCount" class="pill">0색</span></div>
    <div class="row">
      <button id="startBtn">시작</button>
      <button id="stopBtn" class="ghost">중지</button>
      <button id="resetBtn" class="ghost">리셋(점/시드)</button>
      <button id="wireBtn" class="ghost">와이어: ON</button>
    </div>
    <div class="row"><label>속도(초): <span id="speedVal" class="pill">3.0</span></label><input id="speed" type="range" min="1" max="8" step="0.5" value="3"></div>
    <div class="row"><label>스폰주기(ms): <span id="freqVal" class="pill">800</span></label><input id="freq" type="range" min="200" max="2000" step="100" value="800"></div>
    <div class="row"><label>동시 스폰: <span id="densVal" class="pill">3</span></label><input id="dens" type="range" min="1" max="6" step="1" value="3"></div>
  </div>
  <div id="dbg">[READY] 화면에 7점을 찍어 시드를 만드세요.</div>
  <canvas id="seedCanvas"></canvas>
  <div id="three"></div>
  <div id="help">7점 찍기 → 시작(버튼) → 하단의 Enter VR 버튼으로 VR 모드</div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
    import { VRButton } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/VRButton.js';

    // ---------- DOM / HUD ----------
    const $=id=>document.getElementById(id);
    const dbg=$('dbg'), can=$('seedCanvas'), ctx=can.getContext('2d');
    const MAXPTS=7;
    const state={points:[], seed:null, palette:[], running:false};

    const fit=()=>{ can.width=innerWidth; can.height=innerHeight; draw(); };
    const say=s=>{ dbg.textContent=s; console.log(s); };

    function draw(){
      ctx.clearRect(0,0,can.width,can.height);
      ctx.fillStyle="#ffee66";
      state.points.forEach(p=>{ ctx.beginPath(); ctx.arc(p.x,p.y,6,0,Math.PI*2); ctx.fill(); });
      if(state.points.length===MAXPTS){
        ctx.strokeStyle="#ffeb3b"; ctx.lineWidth=2; let idx=0;
        ctx.beginPath(); ctx.moveTo(state.points[idx].x,state.points[idx].y);
        for(let k=0;k<MAXPTS;k++){ idx=(idx+2)%MAXPTS; ctx.lineTo(state.points[idx].x,state.points[idx].y); }
        ctx.closePath(); ctx.stroke();
      }
    }
    function rel(e){ const r=can.getBoundingClientRect(); const p=(e.touches?e.touches[0]:e); return {x:p.clientX-r.left,y:p.clientY-r.top}; }
    let lock=0,last={x:-1e9,y:-1e9};
    function onClick(e){
      const now=performance.now(); if(now<lock) return;
      const p=rel(e); const dx=p.x-last.x, dy=p.y-last.y; if(dx*dx+dy*dy<25) return;
      if(state.points.length>=MAXPTS) return;
      state.points.push(p); last=p; lock=now+120;
      $('ptCount').textContent=state.points.length+'/'+MAXPTS;
      draw();
      if(state.points.length===MAXPTS){ buildSeedAndPalette(); }
    }

    function computeSeed(){
      let s=0; state.points.forEach((p,i)=>{ s^=(((p.x|0)+(p.y|0))<<(i%24)); }); return (s>>>0)||0xA5A5A5A5;
    }
    function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;};}
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
    function hslToHex(h,s,l){
      l=clamp(l,0,1); s=clamp(s,0,1);
      const c=(1-Math.abs(2*l-1))*s, hp=((h%360)+360)%360/60, x=c*(1-Math.abs(hp%2-1));
      let r=0,g=0,b=0;
      if(hp<1){r=c;g=x;} else if(hp<2){r=x;g=c;} else if(hp<3){g=c;b=x;} else if(hp<4){g=x;b=c;} else if(hp<5){r=x;b=c;} else {r=c;b=x;}
      const m=l-c/2; r=Math.round((r+m)*255); g=Math.round((g+m)*255); b=Math.round((b+m)*255);
      return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
    }

    function buildSeedAndPalette(){
      state.seed = computeSeed();
      $('seedVal').textContent = String(state.seed)+' (0x'+(state.seed>>>0).toString(16).toUpperCase()+')';
      const rng = mulberry32(state.seed);
      const base = Math.floor(rng()*360);
      const N=16, spread=360/N;
      const arr=[];
      for(let i=0;i<N;i++){
        const h=(base+i*spread + (rng()*2-1)*10 + 360)%360;
        const s=clamp(0.60 + (rng()*2-1)*0.20, 0.45, 0.95);
        const l=clamp(0.52 + (rng()*2-1)*0.18, 0.35, 0.80);
        arr.push(hslToHex(h,s,l));
      }
      state.palette = arr;
      $('palCount').textContent = arr.length+'색';
      say('[SEED] '+state.seed+' · 팔레트 '+arr.length+'색 생성. 시작을 누르세요.');
    }

    // ---------- UI ----------
    const speedEl=$('speed'), freqEl=$('freq'), densEl=$('dens');
    const speedVal=$('speedVal'), freqVal=$('freqVal'), densVal=$('densVal');
    const wireBtn=$('wireBtn');
    const syncUI=()=>{ speedVal.textContent=Number(speedEl.value).toFixed(1); freqVal.textContent=freqEl.value; densVal.textContent=densEl.value; };
    ['input','change'].forEach(ev=>{ speedEl.addEventListener(ev,syncUI); freqEl.addEventListener(ev,syncUI); densEl.addEventListener(ev,syncUI); });
    syncUI();

    $('startBtn').onclick=()=>{
      if(state.seed==null){ alert('먼저 화면에 7점을 찍어 시드를 생성하세요.'); return; }
      if(!state.running){
        state.running=true; say('[RUN] 실행 시작');
        // 즉시 첫 스폰 + 씨드 캔버스 숨김
        spawn();
        can.style.pointerEvents='none';
        can.style.opacity='0';
      }
    };
    $('stopBtn').onclick=()=>{ state.running=false; say('[STOP] 중지'); };
    $('resetBtn').onclick=()=>{
      state.running=false; state.seed=null; state.palette.length=0; state.points.length=0;
      $('ptCount').textContent='0/7'; $('seedVal').textContent='없음'; $('palCount').textContent='0색';
      can.style.pointerEvents='auto'; can.style.opacity='1'; draw(); say('[RESET] 점과 시드를 초기화했습니다.');
    };

    window.addEventListener('resize', fit, {passive:true});
    window.addEventListener('pointerdown', onClick, true);
    window.addEventListener('touchstart', e=>{ e.preventDefault(); onClick(e); }, {capture:true, passive:false});

    // ---------- Three.js + WebXR ----------
    const root=$('three');
    const renderer=new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:'high-performance' });
    if (THREE.SRGBColorSpace) renderer.outputColorSpace=THREE.SRGBColorSpace;
    renderer.setPixelRatio(Math.min(2, Math.max(0.85, devicePixelRatio||1)));
    renderer.setSize(innerWidth, innerHeight);
    renderer.xr.enabled = true;                          // ★ WebXR 활성화
    document.body.appendChild(VRButton.createButton(renderer)); // ★ Enter VR 버튼
    root.appendChild(renderer.domElement);

    const scene=new THREE.Scene(); scene.fog=new THREE.FogExp2(0x000000, 0.0006);
    const camera=new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 5000);
    camera.position.set(0, 0, 420); scene.add(camera);
    scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const d=new THREE.DirectionalLight(0xffffff, 1.0); d.position.set(1,2,3); scene.add(d);

    const group=new THREE.Group(); scene.add(group);
    let lastT=0, acc=0; const cubes=[]; let wire=true;

    wireBtn.onclick=()=>{
      wire = !wire;
      wireBtn.textContent = '와이어: ' + (wire?'ON':'OFF');
      wireBtn.className = wire ? 'ghost' : '';
      group.traverse(o=>{ if(o.isMesh && o.material) o.material.wireframe = wire; });
      say('[WIRE] '+(wire?'ON':'OFF'));
    };

    function choiceFromPalette(rng){
      const idx = Math.floor(rng()*state.palette.length) % Math.max(1,state.palette.length);
      return new THREE.Color(state.palette[idx] || '#ffffff');
    }
    function createWireCuboid(rng){
      const span=0.25;
      const w = Math.max(12, 40 * (1+(rng()*2-1)*span));
      const h = Math.max(12, 40 * (1+(rng()*2-1)*span));
      const z = Math.max(12, 40 * (1+(rng()*2-1)*span));
      const g = new THREE.BoxGeometry(w,h,z);
      const col = choiceFromPalette(rng);
      const m  = new THREE.MeshBasicMaterial({ color: col, wireframe: wire });
      const mesh = new THREE.Mesh(g, m);
      // 넓게 퍼져 옆으로 스쳐가도록 좌우/상하 범위 확대
      mesh.position.set((rng()-0.5)*300, (rng()-0.5)*180, -800);
      group.add(mesh);
      const now = performance.now();
      const life = Number(speedEl.value)*1000;
      cubes.push({mesh, dieAt: now + life});
    }
    function spawn(){
      if(state.seed==null || state.palette.length===0) return;
      const base = (state.seed ^ (performance.now()|0)) >>> 0;
      const rng = mulberry32(base);
      const n = Number(densEl.value)|0;
      for(let i=0;i<n;i++) createWireCuboid(rng);
    }

    function loop(t){
      const dt = (t-lastT)/1000 || 1/60; lastT=t;
      if(state.running){
        acc += dt*1000;
        const period = Number(freqEl.value);
        while(acc >= period){ spawn(); acc -= period; }
      }
      for(let i=cubes.length-1;i>=0;i--){
        const c=cubes[i];
        c.mesh.rotation.x += dt*1.8; c.mesh.rotation.y += dt*1.6;
        c.mesh.position.z += dt * (900/Number(speedEl.value));
        if(performance.now() >= c.dieAt){
          group.remove(c.mesh); c.mesh.geometry.dispose(); c.mesh.material.dispose(); cubes.splice(i,1);
        }
      }
      renderer.render(scene, camera);
    }
    renderer.setAnimationLoop(loop); // VR/비VR 모두 지원

    fit(); say('[READY] 7점 → 시드 생성 → 시작 → Enter VR');
  </script>
</body>
</html>
