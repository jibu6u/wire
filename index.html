<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seeded Wire Cubes + VR</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:sans-serif}
    #hud{position:fixed;left:16px;top:16px;z-index:10;background:rgba(0,0,0,.8);color:#fff;
         border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:12px;min-width:280px}
    #hud h3{margin:0 0 8px;color:#8be9a3;font-size:15px}
    .row{display:flex;align-items:center;gap:8px;margin:6px 0}
    label{font-size:12px;white-space:nowrap}
    input[type=range]{width:150px}
    .pill{display:inline-block;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.1);font-size:12px}
    button{appearance:none;border:0;border-radius:8px;padding:6px 10px;color:#fff;background:#2a9d8f;cursor:pointer}
    button.ghost{background:#555}
    #dbg{position:fixed;left:16px;top:120px;color:#b3e5c1;z-index:9;font:12px/1.5 monospace;
         background:rgba(0,0,0,.45);padding:8px 10px;border-radius:8px;min-width:280px}
    #seedCanvas{position:fixed;inset:0;display:block;z-index:1;pointer-events:auto;touch-action:none;cursor:crosshair}
    #three{position:fixed;inset:0;z-index:0}
    #help{position:fixed;right:16px;bottom:16px;color:#ccc;background:rgba(0,0,0,.45);padding:6px 8px;border-radius:8px;font-size:12px}
  </style>
</head>
<body>
  <div id="hud">
    <h3>Seeded Wire Cubes</h3>
    <div class="row">시드: <span id="seedVal" class="pill">없음</span></div>
    <div class="row">점: <span id="ptCount" class="pill">0/7</span> · 팔레트: <span id="palCount" class="pill">0색</span></div>
    <div class="row">
      <button id="startBtn">시작</button>
      <button id="stopBtn" class="ghost">중지</button>
      <button id="resetBtn" class="ghost">리셋</button>
    </div>
    <div class="row"><label>속도(초): <span id="speedVal" class="pill">3.0</span></label>
      <input id="speed" type="range" min="1" max="8" step="0.5" value="3"></div>
    <div class="row"><label>스폰주기(ms): <span id="freqVal" class="pill">800</span></label>
      <input id="freq" type="range" min="200" max="2000" step="100" value="800"></div>
    <div class="row"><label>동시 스폰: <span id="densVal" class="pill">3</span></label>
      <input id="dens" type="range" min="1" max="6" step="1" value="3"></div>
  </div>
  <div id="dbg">[READY] 7점을 찍어 시드를 만드세요.</div>
  <canvas id="seedCanvas"></canvas>
  <div id="three"></div>
  <div id="help">7점 찍기 → 시작 → Enter VR 버튼</div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
    import { VRButton } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/VRButton.js';

    const $=id=>document.getElementById(id);
    const dbg=$('dbg'), can=$('seedCanvas'), ctx=can.getContext('2d');
    const MAXPTS=7;
    const state={points:[], seed:null, palette:[], running:false};

    const fit=()=>{ can.width=innerWidth; can.height=innerHeight; draw(); };
    const say=s=>{ dbg.textContent=s; console.log(s); };

    // ----- 점 찍기 -----
    function draw(){
      ctx.clearRect(0,0,can.width,can.height);
      ctx.fillStyle="#ffee66";
      state.points.forEach(p=>{ ctx.beginPath(); ctx.arc(p.x,p.y,6,0,Math.PI*2); ctx.fill(); });
      if(state.points.length===MAXPTS){
        ctx.strokeStyle="#ffeb3b"; ctx.lineWidth=2; let idx=0;
        ctx.beginPath(); ctx.moveTo(state.points[idx].x,state.points[idx].y);
        for(let k=0;k<MAXPTS;k++){ idx=(idx+2)%MAXPTS; ctx.lineTo(state.points[idx].x,state.points[idx].y); }
        ctx.closePath(); ctx.stroke();
      }
    }
    function rel(e){ const r=can.getBoundingClientRect(); const p=(e.touches?e.touches[0]:e); return {x:p.clientX-r.left,y:p.clientY-r.top}; }
    let lock=0,last={x:-1e9,y:-1e9};
    function onClick(e){
      const now=performance.now(); if(now<lock) return;
      const p=rel(e); const dx=p.x-last.x, dy=p.y-last.y; if(dx*dx+dy*dy<25) return;
      if(state.points.length>=MAXPTS) return;
      state.points.push(p); last=p; lock=now+120;
      $('ptCount').textContent=state.points.length+'/'+MAXPTS;
      draw();
      if(state.points.length===MAXPTS){ buildSeedAndPalette(); }
    }

    // ----- 시드 & 팔레트 -----
    function computeSeed(){
      let s=0; state.points.forEach((p,i)=>{ s^=(((p.x|0)+(p.y|0))<<(i%24)); }); return (s>>>0)||0xA5A5A5A5;
    }
    function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;};}
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
    function hslToHex(h,s,l){
      l=clamp(l,0,1); s=clamp(s,0,1);
      const c=(1-Math.abs(2*l-1))*s, hp=((h%360)+360)%360/60, x=c*(1-Math.abs(hp%2-1));
      let r=0,g=0,b=0;
      if(hp<1){r=c;g=x;} else if(hp<2){r=x;g=c;} else if(hp<3){g=c;b=x;} else if(hp<4){g=x;b=c;} else if(hp<5){r=x;b=c;} else {r=c;b=x;}
      const m=l-c/2; r=Math.round((r+m)*255); g=Math.round((g+m)*255); b=Math.round((b+m)*255);
      return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
    }

    function buildSeedAndPalette(){
      state.seed = computeSeed();
      $('seedVal').textContent = state.seed;
      const rng = mulberry32(state.seed);
      const base = Math.floor(rng()*360);
      const arr=[];
      for(let i=0;i<16;i++){
        const h=(base+i*22.5 + (rng()*2-1)*10 + 360)%360;
        const s=Math.max(0.45, Math.min(0.95, 0.6+(rng()*2-1)*0.2));
        const l=Math.max(0.35, Math.min(0.8, 0.52+(rng()*2-1)*0.18));
        arr.push(hslToHex(h,s,l));
      }
      state.palette = arr;
      $('palCount').textContent = arr.length+"색";
      say("[SEED] 팔레트 생성 완료.");
    }

    function choiceFromPalette(rng){
      const idx = Math.floor(rng()*state.palette.length);
      return new THREE.Color(state.palette[idx]);
    }

    // ----- UI -----
    const speedEl=$('speed'), freqEl=$('freq'), densEl=$('dens');
    const speedVal=$('speedVal'), freqVal=$('freqVal'), densVal=$('densVal');
    const syncUI=()=>{ speedVal.textContent=speedEl.value; freqVal.textContent=freqEl.value; densVal.textContent=densEl.value; };
    ['input','change'].forEach(ev=>{ speedEl.addEventListener(ev,syncUI); freqEl.addEventListener(ev,syncUI); densEl.addEventListener(ev,syncUI); });
    syncUI();

    $('startBtn').onclick=()=>{
      if(state.seed==null){ alert("먼저 7점을 찍으세요."); return; }
      if(!state.running){
        state.running=true; say("[RUN] 시작");
        spawn(); // 첫 큐브 즉시
        can.style.display="none"; // 점찍기 캔버스 숨김
      }
    };
    $('stopBtn').onclick=()=>{ state.running=false; say("[STOP] 중지"); };
    $('resetBtn').onclick=()=>{ state.running=false; state.seed=null; state.palette=[]; state.points=[];
      $('ptCount').textContent="0/7"; $('seedVal').textContent="없음"; $('palCount').textContent="0색";
      can.style.display="block"; draw(); say("[RESET] 초기화"); };

    window.addEventListener('resize', fit);
    window.addEventListener('pointerdown', onClick);
    window.addEventListener('touchstart', e=>{ e.preventDefault(); onClick(e); }, {passive:false});

    // ----- Three.js + VR -----
    const renderer=new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(innerWidth,innerHeight);
    renderer.xr.enabled=true;
    document.body.appendChild(renderer.domElement);
    document.body.appendChild(VRButton.createButton(renderer));

    const scene=new THREE.Scene();
    const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,2000);
    camera.position.z=400;
    scene.add(new THREE.AmbientLight(0xffffff,0.9));
    const dir=new THREE.DirectionalLight(0xffffff,1); dir.position.set(1,2,3); scene.add(dir);

    const group=new THREE.Group(); scene.add(group);
    let cubes=[];

    function createCube(rng){
      const g=new THREE.BoxGeometry(30,30,30);
      const col=choiceFromPalette(rng);   // ★ 팔레트 기반 랜덤 색상
      const m=new THREE.MeshBasicMaterial({color:col,wireframe:true});
      const mesh=new THREE.Mesh(g,m);
      mesh.position.set((rng()-0.5)*300,(rng()-0.5)*200,-800);
      group.add(mesh);
      const life=Number(speedEl.value)*1000;
      cubes.push({mesh,dieAt:performance.now()+life});
    }
    function spawn(){
      if(!state.seed || !state.palette.length) return;
      const base=(state.seed^(performance.now()|0))>>>0;
      const rng=mulberry32(base);
      for(let i=0;i<Number(densEl.value);i++) createCube(rng);
    }

    function loop(){
      if(state.running){ spawn(); }
      const now=performance.now();
      for(let i=cubes.length-1;i>=0;i--){
        const c=cubes[i];
        c.mesh.rotation.x+=0.02; c.mesh.rotation.y+=0.018;
        c.mesh.position.z+=2.0;
        if(now>=c.dieAt){ group.remove(c.mesh); cubes.splice(i,1); }
      }
      renderer.render(scene,camera);
    }
    renderer.setAnimationLoop(loop);

    fit();
  </script>
</body>
</html>
